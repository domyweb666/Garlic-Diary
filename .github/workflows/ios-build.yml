name: iOS build check

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build Suanshu (simulator check + unsigned device IPA)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for simulator (compile check)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Suanshu.xcodeproj \
            -target Suanshu \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build-sim.log | grep -E --line-buffered "error:|warning:|BUILD " || true
          grep -q "BUILD SUCCEEDED" build-sim.log

      - name: Build for device, unsigned (for sideloading)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Suanshu.xcodeproj \
            -target Suanshu \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build" \
            build 2>&1 | tee build-device.log | grep -E --line-buffered "error:|warning:|BUILD " || true
          grep -q "BUILD SUCCEEDED" build-device.log
          rm -rf Payload
          mkdir -p Payload
          cp -R "build/Release-iphoneos/Suanshu.app" Payload/
          zip -qr Suanshu-unsigned.ipa Payload
          ls -la Suanshu-unsigned.ipa

      - name: Upload logs and IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suanshu-build
          path: |
            ios/build-sim.log
            ios/build-device.log
            ios/Suanshu-unsigned.ipa

  ui-test:
    name: UI test on simulator (walk the main flow, screenshots)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # 用 UDID 指定模擬器。用「name=iPhone 16e,OS=latest」這種寫法會對不上 runtime
      # （有些機型只在特定 iOS 版本裡有），直接挑最新 iOS runtime 裡的一台 iPhone 最穩。
      - name: Pick an iPhone in the newest iOS runtime
        id: sim
        run: |
          xcrun simctl list -j devices available > "$RUNNER_TEMP/sims.json"
          python3 - "$RUNNER_TEMP/sims.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, re, sys
          devices = json.load(open(sys.argv[1]))["devices"]
          best = None
          for runtime, devs in devices.items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              ver = (int(m.group(1)), int(m.group(2)))
              for d in devs:
                  name = d["name"]
                  if not d.get("isAvailable") or not name.startswith("iPhone"):
                      continue
                  n = re.search(r"iPhone (\d+)", name)
                  plain = re.fullmatch(r"iPhone \d+", name) is not None
                  key = (ver, plain, int(n.group(1)) if n else 0, name)
                  if best is None or key > best[0]:
                      best = (key, d["udid"], name, runtime)
          if best is None:
              sys.exit("no available iPhone simulator")
          print(f"udid={best[1]}")
          print(f"name={best[2]}")
          print(f"runtime={best[3]}")
          PY
          grep -E '^(udid|name|runtime)=' "$GITHUB_OUTPUT"

      - name: Boot the simulator
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          echo "Using ${{ steps.sim.outputs.name }} (${{ steps.sim.outputs.runtime }})"
          # 硬體鍵盤接著的話軟體鍵盤不會出來，XCTest 打字會失敗
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          defaults write com.apple.iphonesimulator DevicePreferences -dict-add "$UDID" \
            '<dict><key>ConnectHardwareKeyboard</key><false/></dict>' || true
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # 截圖的狀態列固定成 9:41、滿電、滿格
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4

      - name: Build and run the UI test
        working-directory: ios
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          # 測試會把每張截圖直接寫成 PNG 到這裡。xcodebuild 會把 TEST_RUNNER_ 前綴拿掉再傳給測試程序。
          TEST_RUNNER_SUANSHU_SCREENSHOT_DIR: ${{ github.workspace }}/ios/screenshots
        run: |
          set -o pipefail
          mkdir -p screenshots
          xcodebuild test \
            -project Suanshu.xcodeproj \
            -scheme Suanshu \
            -destination "id=$UDID" \
            -derivedDataPath "$PWD/DerivedData" \
            -resultBundlePath "$PWD/UITests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build-uitest.log | grep -E --line-buffered "error:|warning:|Test Case|Test Suite|Executed|TEST |BUILD " || true
          grep -q "TEST SUCCEEDED" build-uitest.log

      # 沒有 Xcode 也能看截圖：測試已經直接寫了 PNG；這裡再從 .xcresult 匯出一份，
      # 萬一直接寫的那份沒出來（例如環境變數沒傳到），就拿匯出的補上。
      - name: Export attachments from the .xcresult
        if: always()
        working-directory: ios
        run: |
          if [ -d UITests.xcresult ]; then
            mkdir -p xcresult-attachments
            xcrun xcresulttool export attachments --path UITests.xcresult --output-path xcresult-attachments \
              || echo "::warning::xcresulttool export attachments failed"
          fi
          if [ -z "$(ls -A screenshots 2>/dev/null)" ] && [ -f xcresult-attachments/manifest.json ]; then
            python3 - <<'PY' || echo "::warning::could not copy attachments into screenshots/"
          import json, os, shutil
          os.makedirs("screenshots", exist_ok=True)
          for test in json.load(open("xcresult-attachments/manifest.json")):
              for a in test.get("attachments", []):
                  src = os.path.join("xcresult-attachments", a["exportedFileName"])
                  name = a.get("suggestedHumanReadableName") or a["exportedFileName"]
                  if os.path.isfile(src):
                      shutil.copy(src, os.path.join("screenshots", name))
          PY
          fi
          {
            echo "## UI test screenshots"
            echo
            echo "Simulator: ${{ steps.sim.outputs.name }} (${{ steps.sim.outputs.runtime }})"
            echo
            ls screenshots 2>/dev/null | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suanshu-ui-screenshots
          path: ios/screenshots
          if-no-files-found: warn

      - name: Upload test result bundle and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suanshu-ui-xcresult
          path: |
            ios/UITests.xcresult
            ios/build-uitest.log
            ios/xcresult-attachments
          if-no-files-found: warn
